<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GHOUL // Vampire: The Masquerade V5 & V20 Suite</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <style>
    html, body {
      background-color: #050505;
      color: #e5e7eb;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    
    /* Custom Gothic Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #09090c;
    }
    ::-webkit-scrollbar-thumb {
      background: #272732;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #881337;
    }

    /* Leaflet Dark Filter */
    .leaflet-tile-pane {
      filter: brightness(0.65) invert(1) contrast(3) hue-rotate(200deg) saturate(0.35) brightness(0.7);
    }
    .leaflet-container {
      background: #09090b !important;
    }

    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
    }
  </style>
</head>
<body class="bg-[#050505] text-[#e5e7eb] min-h-screen selection:bg-rose-900 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
